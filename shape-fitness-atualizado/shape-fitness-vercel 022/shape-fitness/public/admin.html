<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Painel | Shape Fitness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>body{padding:0}.box{max-width:420px;margin:12vh auto;background:var(--card);padding:32px;border-radius:14px;border-top:5px solid var(--y)}
.login-box{max-width:330px;margin:18vh auto;padding:24px;background:#101010;border:1px solid #242424;border-radius:12px;box-shadow:0 14px 45px rgba(0,0,0,.28)}
.login-brand{font:700 .9rem Barlow,sans-serif;letter-spacing:.14em;color:#aaa;margin-bottom:22px}.login-brand span{font-size:.72rem;color:#666;letter-spacing:.1em}
.login-box label{font-size:.82rem;color:#aaa}.login-box input{background:#090909;border-color:#292929}.login-box .btn{background:#d7b900;border-color:#d7b900;padding:10px 16px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:.92rem}input,select,textarea{width:100%;background:#0d0d0d;color:#fff;border:1px solid #3a3a3a;border-radius:8px;padding:11px;font:inherit}textarea{min-height:84px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 4%;background:#0a0a0a;border-bottom:1px solid #222;position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:10px}
.mn{display:flex;gap:6px;flex-wrap:wrap}.mn button,.btn{cursor:pointer}.mn button{background:none;border:0;color:var(--m);font:600 1rem Barlow;padding:8px 12px;border-radius:8px}.mn button.on{background:var(--y);color:#000}
main{width:min(1000px,92%);margin:28px auto 80px}.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.it{background:var(--card);padding:16px;border-radius:10px;margin:10px 0;border:1px solid #2a2a2a}
.err{color:#ff7b7b;min-height:1.4em;margin-top:10px}.ok{color:#3ddc84}.st{font:800 2.6rem 'Barlow Condensed';color:var(--y)}.dng{background:#3a1515;border-color:#ff5a5a;color:#ffb3b3}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.th{height:90px;border-radius:8px;object-fit:cover;margin-top:8px}
</style></head><body><div id="app"></div><script src="/admin.js"></script></body></html>
